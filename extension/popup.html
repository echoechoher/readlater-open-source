<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        width: 286px;
        margin: 0;
        padding: 14px;
        color: #111827;
        background: #ffffff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        font-size: 16px;
        line-height: 1.2;
        margin: 0 0 12px;
      }

      button {
        width: 100%;
        min-height: 38px;
        border: 1px solid #374151;
        border-radius: 7px;
        background: #374151;
        color: white;
        cursor: pointer;
        font: inherit;
        margin-bottom: 8px;
      }

      button.secondary {
        background: white;
        color: #222421;
        border-color: #deded6;
      }

      details {
        border-top: 1px solid #e5e7eb;
        margin-top: 10px;
        padding-top: 8px;
      }

      summary {
        color: #6b7280;
        cursor: pointer;
        font-size: 12px;
        list-style: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      label {
        color: #6b7280;
        display: block;
        font-size: 12px;
        margin: 10px 0 5px;
      }

      input {
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        color: #111827;
        font: inherit;
        font-size: 12px;
        padding: 8px 9px;
        width: 100%;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #status {
        min-height: 18px;
        color: #6d716a;
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Readlater</h1>
    <button id="save">保存当前页面</button>
    <button id="open" class="secondary">打开 Readlater</button>
    <details>
      <summary>设置</summary>
      <label for="base-url">地址</label>
      <input id="base-url" type="url" spellcheck="false" />
      <label for="token">Bearer Token（可选）</label>
      <input id="token" type="password" spellcheck="false" />
      <button id="save-config" class="secondary">保存设置</button>
    </details>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
